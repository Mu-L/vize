name: String Storage Bench

on:
  pull_request:
    paths:
      - "crates/vize_croquis_cf/**"
      - ".github/workflows/string-storage-bench.yml"
  workflow_dispatch:
    inputs:
      base_sha:
        description: Full ancestor commit SHA
        required: true
        type: string
      head_sha:
        description: Full candidate commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  bounded-storage:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2, 3]
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.base_sha || github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./head/.github/actions/setup-rust-sticky-cache
        with:
          key: string-storage
          cache-key-suffix: ${{ matrix.repetition }}
          target-path: head/target
      - name: Validate exact commits and use identical benchmark harness
        env:
          BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
          DISPATCH_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" == "$DISPATCH_SHA" ]]
          [[ "$(git -C base rev-parse HEAD)" == "$BASE_SHA" ]]
          [[ "$(git -C head rev-parse HEAD)" == "$HEAD_SHA" ]]
          git -C head merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"
          cp head/crates/vize_croquis_cf/benches/{cross_file,string_storage}.rs base/crates/vize_croquis_cf/benches/
          python3 - <<'PY'
          from pathlib import Path
          path = Path('base/crates/vize_croquis_cf/Cargo.toml')
          text = path.read_text()
          if 'davinci_harness.workspace = true' not in text:
              text = text.replace('[dev-dependencies]', '[dev-dependencies]\ndavinci_harness.workspace = true')
              path.write_text(text)
          PY
      - name: Check candidate CF semantics and lints
        working-directory: head
        run: |
          cargo test --profile ci -p vize_croquis_cf
          cargo clippy -p vize_croquis_cf --lib --tests -- -D warnings
      - name: Compare controlled production storage and traversal
        run: |
          set -euo pipefail
          for side in base head; do
            (cd "$side" && STRING_STORAGE_REPORT_DIR="$GITHUB_WORKSPACE/reports/$side" cargo bench -p vize_croquis_cf --bench cross_file --target-dir "$GITHUB_WORKSPACE/head/target/$side" -- string_storage --warm-up-time 0.5 --measurement-time 1 --sample-size 30 --save-baseline "$side")
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          for before in Path('reports/base').glob('tree_*.json'):
              after = Path('reports/head') / before.name
              assert json.loads(before.read_text())['semantic'] == json.loads(after.read_text())['semantic'], before.name
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: string-storage-${{ matrix.repetition }}
          path: |
            reports/
            head/target/base/criterion/
            head/target/head/criterion/
          if-no-files-found: error
          retention-days: 14
