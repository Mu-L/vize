[package]
name = "vize_davinci"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Davinci - dump/round-trip substrate (Folio) for the Vize compiler rearchitecture"
publish = false
metadata.vize.stability = "experimental"

[dependencies]
vize_carton = { workspace = true }
# Proc-macro: a host build dependency (never linked into any target, so the
# wasm32/no_std claims are untouched) - the approved std edge P2-14 audits.
vize_davinci_derive = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
davinci_harness = { workspace = true }
insta = { workspace = true }
# The TS-15 schema validator reused by path from vize_carton's tests
# (davinci_profile_export/schema_check.rs) needs these two.
regex-lite = { workspace = true }
serde_json = { workspace = true }
vize_atelier_core = { workspace = true }
vize_atelier_sfc = { workspace = true }
vize_croquis = { workspace = true }

[[bin]]
name = "davinci-opt"
path = "src/bin/davinci-opt.rs"

[[bench]]
name = "davinci"
harness = false
